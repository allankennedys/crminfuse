    <title>CRM Infuse</title>
    <script>
      // Tema antes do primeiro desenho: evita piscar escuro → claro.
      try {
        var t = localStorage.getItem('infuse-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        document.getElementById('theme-color').setAttribute('content', t === 'light' ? '#f4f5f7' : '#0a0a0b')
      } catch (e) {}
    </script>
    <style>
      /* Tela de abertura: aparece no primeiro quadro, antes do app carregar.
         Fica por cima do app e só sai (com fade) quando o app está pronto e já
         passou um tempo mínimo (main.tsx), senão pisca e some. Cores iguais às do app, para não haver
         piscada preta nem troca de fundo. */
      html { background: #0a0a0b; }
      html[data-theme="light"] { background: #f4f5f7; }
      #splash { position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; background: #0a0a0b; }
      html[data-theme="light"] #splash { background: #f4f5f7; }
      #splash.saindo { opacity: 0; transition: opacity .35s ease; pointer-events: none; }
      #splash img { width: 92px; height: 92px; animation: splash-pulse 1.6s ease-in-out infinite; }
      #splash .dots { display: flex; gap: 7px; }
      #splash .dots i { width: 7px; height: 7px; border-radius: 50%; background: #1f6fe0; opacity: .25; animation: splash-dot 1.2s ease-in-out infinite; }
      #splash .dots i:nth-child(2) { animation-delay: .15s; }
      #splash .dots i:nth-child(3) { animation-delay: .3s; }
      @keyframes splash-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes splash-dot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash .dots i { animation: none; } #splash .dots i { opacity: .6; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/favicon.png?v=2" alt="" width="92" height="92" /><span class="dots"><i></i><i></i><i></i></span></div>
