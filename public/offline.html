<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f6fe0" />
  <title>Sem conexão · Infuse</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0b1b3a; color: #eaf1ff; text-align: center; }
    main { max-width: 360px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 20px; line-height: 1.5; color: #b8c7e6; }
    button { border: 0; border-radius: 10px; padding: 11px 20px; background: #1f6fe0; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Sem conexão</h1>
    <p>Não consegui falar com o servidor. Confira a internet e tente de novo. As conversas não ficam salvas no aparelho, por segurança.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
