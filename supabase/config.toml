# Configuração mínima para o CLI publicar as Edge Functions.
#   npx supabase functions deploy --project-ref <ref> --use-api
#
# verify_jwt = false: quem chama não é um usuário logado — o cron (header
# x-worker-secret) ou o WhatsApp (token na URL). Cada função confere a
# própria credencial.
project_id = "infuse-crm"

[functions.worker]
verify_jwt = false

[functions.crm-worker]
verify_jwt = false

[functions.wa-webhook]
verify_jwt = false

[functions.push]
verify_jwt = false
